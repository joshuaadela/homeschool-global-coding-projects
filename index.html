<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homeschool Coding Projects</title>
<style>
  :root {
    --bg: #fbf8f3; --card: #ffffff; --ink: #1f2430; --muted: #6b7180;
    --line: #e7e1d7; --accent: #2f7d5b; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161b; --card: #1d2027; --ink: #eceef2; --muted: #9aa0ad;
            --line: #2c303a; --accent: #5cc195; --accent-ink: #0f1a14; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lede { color: var(--muted); margin: 0 0 32px; max-width: 60ch; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
          list-style: none; padding: 0; margin: 0; }
  .card { display: flex; flex-direction: column; gap: 6px; height: 100%; padding: 20px;
          background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          color: inherit; text-decoration: none; transition: transform .15s, border-color .15s; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .card h2 { font-size: 19px; margin: 0; }
  .card .folder { color: var(--muted); font-size: 13px; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  .card .play { margin-top: auto; padding-top: 12px; align-self: flex-start; font-weight: 600; font-size: 14px;
                background: var(--accent); color: var(--accent-ink); padding: 6px 14px; border-radius: 999px; }
  .status { color: var(--muted); font-size: 14px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>Homeschool Coding Projects</h1>
  <p class="lede">Games and projects built while learning to code. Pick one to play.</p>
  <ul class="grid" id="projects"></ul>
  <p class="status" id="status"></p>
</main>
<script>
  // Every top-level folder in this repo is a project. New folders appear here automatically.
  const REPO = 'joshuaadela/homeschool-global-coding-projects';
  const FALLBACK = ['aldie-and-briels-game', 'lexies-game-learning-project-1', 'gameify'];
  const list = document.getElementById('projects');
  const status = document.getElementById('status');

  const pretty = s => s.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  async function titleOf(folder) {
    try {
      const html = await (await fetch(`./${folder}/`)).text();
      const m = html.match(/<title>([^<]*)<\/title>/i);
      if (m && m[1].trim()) return m[1].trim();
    } catch (e) {}
    return pretty(folder);
  }

  function card(folder, title) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'card'; a.href = `./${folder}/`;
    const h = document.createElement('h2'); h.textContent = title;
    const f = document.createElement('span'); f.className = 'folder'; f.textContent = folder;
    const p = document.createElement('span'); p.className = 'play'; p.textContent = 'Play ▶';
    a.append(h, f, p); li.append(a); return li;
  }

  async function load() {
    let folders = FALLBACK;
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/`);
      if (res.ok) {
        folders = (await res.json())
          .filter(x => x.type === 'dir' && !x.name.startsWith('.') && !x.name.startsWith('_'))
          .map(x => x.name);
      }
    } catch (e) {}
    const titles = await Promise.all(folders.map(titleOf));
    folders.forEach((f, i) => list.append(card(f, titles[i])));
    status.textContent = folders.length ? `${folders.length} project${folders.length === 1 ? '' : 's'}` : 'No projects yet.';
  }
  load();
</script>
</body>
</html>
