    ell(cx - 4, y - 36, 16, 26, '#fff4e2');
    rect(cx - 22, y - 12, 12, 12, '#ff9f45'); rect(cx + 14, y - 12, 12, 12, '#ff9f45');
    const hy = y - 82;
    poly([[cx - 22, hy - 16], [cx + 22, hy - 16], [cx + 22, hy + 12], [cx - 50 - Math.max(0, a) * 6, hy + 6], [cx - 22, hy + 14]], '#ff9f45');
    poly([[cx - 50, hy + 6], [cx - 22, hy + 14], [cx, hy + 16]], '#fff4e2');
    for (const ex of [-16, 10]) poly([[ex + cx - 8, hy - 14], [ex + cx, hy - 42], [ex + cx + 8, hy - 14]], '#ff9f45');
    poly([[cx - 22, hy - 4], [cx - 8, hy - 8], [cx - 10, hy]], '#1a1a22');
    rect(cx - 4, hy - 14, 3, 10, '#e63946'); rect(cx + 2, hy - 14, 3, 10, '#e63946');
    circ(cx - 52 - Math.max(0, a) * 6, hy + 5, 4, '#1a1a22');
  }

  function drawBoss() {
    const b = boss, fade = b.phase === 'leave' ? Math.max(0, 1 - b.phaseT / 1.4) : 1;

  function bossShot(o) {
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
    ctx.save(); ctx.translate(cx, cy);
    switch (o.kind) {
      case 'fan': ctx.rotate(o.t * 10); ell(0, -4, 10, 15, '#4f9d5d'); rect(-2, 8, 4, 10, '#8b5a2b'); break;
      case 'petals': for (let i = 0; i < 5; i++) { const an = o.t * 9 + i * 1.26; ell(Math.cos(an) * 8, Math.sin(an) * 8, 6, 4, i % 2 ? '#ffc4d8' : '#ff9ac1', an); } circ(0, 0, 4, '#ffffff'); break;
      case 'spear': ctx.rotate(Math.atan2(o.vy, o.vx)); rect(-17, -3, 30, 6, '#8fca63'); rect(-6, -3, 3, 6, '#4e8a5e'); poly([[13, -5], [20, 0], [13, 5]], '#dfe6ee'); break;
      case 'bubble': circ(0, 0, 11, '#b96bff'); circ(-4, -4, 3.5, '#ead5ff'); circ(5, 5, 2, '#7d3bbf'); break;
      case 'snowball': ctx.rotate(o.t * 6); circ(0, 0, 13, '#ffffff'); circ(4, -3, 3, '#dbe7f5'); break;
      case 'icicle': poly([[-18, 0], [16, -7], [18, 0], [16, 7]], '#bfe6ff'); rect(4, -2, 10, 2, '#ffffff'); break;
      case 'firework': ctx.rotate(o.t * 8); circ(0, 0, 10, '#e63946'); rect(-2, -14, 4, 6, '#ffd23f'); for (let i = 0; i < 4; i++) circ(Math.cos(i * 1.57) * 14, Math.sin(i * 1.57) * 14, 2.5, '#ffd23f'); break;
      case 'fireball': poly([[0, -10], [28, -4 + Math.sin(o.t * 30) * 3], [30, 0], [28, 4], [0, 10]], '#ffd23f'); circ(0, 0, 11, '#ff6b1c'); circ(-2, -2, 5, '#ffe9a8'); break;
      case 'starfish': { ctx.rotate(o.t * 7); const pts = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 6 : 14, an = i * Math.PI / 5; pts.push([Math.cos(an) * r, Math.sin(an) * r]); } poly(pts, '#ff9f45'); circ(0, 0, 3, '#ffd23f'); break; }
      case 'ink': circ(0, 0, 11, '#2a1838'); circ(12, -3, 5, '#2a1838'); circ(14, 5, 3, '#2a1838'); circ(-4, -4, 3, '#6b4a8a'); break;
      case 'chestnut': ctx.rotate(o.t * 6); for (let i = 0; i < 8; i++) { const an = i * 0.785; poly([[Math.cos(an) * 8, Math.sin(an) * 8], [Math.cos(an + 0.2) * 15, Math.sin(an + 0.2) * 15], [Math.cos(an + 0.4) * 8, Math.sin(an + 0.4) * 8]], '#a6c45a'); } circ(0, 0, 10, '#7a4a24'); break;
      default: poly([[0, -14], [10, 2], [0, 12], [-10, 2]], '#4dc9ff'); circ(0, 4, 5, '#e6fbff'); // foxfire
    }

  function drawBackground() {
    const sc = SCENES[sceneIdx], L = sc.layers || {};
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    for (const [o, c] of sc.sky) sky.addColorStop(o, c);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, GROUND);
    ctx.globalAlpha = 0.06; ctx.fillStyle = halftone; ctx.fillRect(0, GROUND * 0.55, W, GROUND * 0.45); ctx.globalAlpha = 1;

    sc.celestial();
    if (sc.backdrop) sc.backdrop();
    if (sc.cloud) for (const c of clouds) outlined(() => cloudShape(c, sc.cloud), 2);

    // speed lines, stronger as the run gets faster (and while invincible)
    if (state === 'running') {
      const a = Math.min(0.7, (speed * SPEEDS[speedLvl] - 420) / 900 + (anyPower('star') ? 0.5 : 0));
      if (a > 0.02) {
        ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 2;
        ctx.beginPath();
        for (const l of speedLines) { ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + l.len, l.y); }
        ctx.stroke();
      }
    }

    const midL = (L.mid || MID)();
    drawLayer(farX, (L.far || FAR)(), sc.far, 0.1);
    drawLayer(midX, midL, sc.mid, 0.12);
    placeProps(midX, 340, midL, 7, sc.midProp);
    drawLayer(hillX, NEAR(), sc.near, 0.14);
    placeProps(hillX, 230, NEAR(), 3, sc.nearProp);

    // ground strip + path
    const g = sc.ground;
    const dirt = ctx.createLinearGradient(0, GROUND, 0, H);
    dirt.addColorStop(0, g.dirt[0]); dirt.addColorStop(1, g.dirt[1]);
    ctx.fillStyle = dirt; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.globalAlpha = 0.1; ctx.fillStyle = halftone; ctx.fillRect(0, GROUND, W, H - GROUND); ctx.globalAlpha = 1;
    rect(0, GROUND, W + 1, 7, g.grass);
    rect(0, GROUND - 1, W + 1, 3, INK);
    rect(0, GROUND + 7, W + 1, 2, INK);
    for (const b of groundBits) rect(b.x, GROUND + b.dy, b.w, 3, g.bits);
    if (sc.overlay) sc.overlay();
  }

  // falling particles: petals, bamboo leaves, snow, festival embers, sea spray or maple leaves
  function drawPetals() {
    const kind = SCENES[sceneIdx].particle, t = performance.now() / 1000;
    ctx.lineWidth = 0.8;
    petals.forEach((p, i) => {
      ctx.beginPath();
      if (kind === 'petal') { ctx.fillStyle = '#ffc4d4'; ctx.strokeStyle = '#d9718f'; ctx.ellipse(p.x, p.y, 3.2, 1.8, p.rot, 0, TAU); }
      else if (kind === 'leaf') { ctx.fillStyle = '#9fd66f'; ctx.strokeStyle = '#3f7f3a'; ctx.ellipse(p.x, p.y, 5, 1.5, p.rot, 0, TAU); }
      else if (kind === 'snow') { ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#9fb3d6'; ctx.arc(p.x, p.y, 1.4 + (i % 3) * 0.6, 0, TAU); }
      else if (kind === 'spray') { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.strokeStyle = 'rgba(80,150,220,0.6)'; ctx.arc(p.x, p.y, 1.5 + (i % 2), 0, TAU); }
      else if (kind === 'ember') {
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 4 + i);
        ctx.fillStyle = 'rgba(255,200,80,0.25)'; ctx.arc(p.x, p.y, 4.5, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#ff9f1c'; ctx.arc(p.x, p.y, 1.8, 0, TAU);
      } else { // maple: little five-point leaf
        ctx.fillStyle = i % 2 ? '#e8452c' : '#ff9a2e'; ctx.strokeStyle = '#8a2a1a';
        for (let k = 0; k < 10; k++) {
          const a = p.rot + k * Math.PI / 5, r = k % 2 ? 1.6 : 4;
          k ? ctx.lineTo(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r) : ctx.moveTo(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r);
        }
        ctx.closePath();
      }
      ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }

  // ---------- HUD ----------
  function pad(n) { return String(Math.floor(n)).padStart(5, '0'); }

  // skill badge: glyph when ready, a dark pie + seconds while cooling down, a coloured ring while active
  function drawSkill(p, x, y) {
    const sk = SKILLS[p.char], r = 13, t = performance.now() / 1000, ready = p.skillCd <= 0;
    circ(x, y, r + 2.5, INK);
    circ(x, y, r, ready ? sk.color : '#7a7a8a');
    if (ready) {
      ctx.strokeStyle = `rgba(255,255,255,${0.5 + 0.5 * Math.sin(t * 6)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r + 5, 0, TAU); ctx.stroke();
      comicText(sk.glyph, x, y + 6, 16, '#ffffff');
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.moveTo(x, y);
      ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * (p.skillCd / SKILL_CD)); ctx.closePath(); ctx.fill();
      comicText(String(Math.ceil(p.skillCd)), x, y + 6, 16, '#ffffff');
    }
    if (p.skillT > 0 && sk.dur) {
      ctx.strokeStyle = sk.color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, y, r + 5, -Math.PI / 2, -Math.PI / 2 + TAU * (p.skillT / sk.dur)); ctx.stroke();
    }
  }

  function drawOrbs(p, hx, y) {
    for (const k of POWER_KEYS) {
      if (p.power[k] <= 0) continue;
      const def = POWERUPS[k];
      drawOrb(k, hx, y, 12);
      if (k !== 'shield') {
        ctx.strokeStyle = INK; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(hx, y, 17, -Math.PI / 2, -Math.PI / 2 + TAU * (p.power[k] / def.duration)); ctx.stroke();
      }
      hx += 42;
    }
  }

  function captionBox(lines, cx, cy) {
    ctx.font = `16px ${FONT}`;
    const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 28, h = lines.length * 20 + 14;
    const x = cx - w / 2, y = cy - h / 2;
    rect(x + 4, y + 4, w, h, INK);
    rect(x, y, w, h, INK);
    rect(x + 2.5, y + 2.5, w - 5, h - 5, '#fff3b0');
    ctx.fillStyle = INK; ctx.textAlign = 'center';
    lines.forEach((l, i) => ctx.fillText(l, cx, y + 24 + i * 20));
  }

  function draw() {
    drawBackground();
    drawFireworks();

    [...platforms].sort((a, b) => b.lv - a.lv).forEach(pl => outlined(() => platformShape(pl), 2));
    if (boss) drawBoss();
    items.forEach(drawItem);
    for (const o of obstacles) {
      // red danger glow underneath so obstacles read instantly against the busy scenery
      const cx = o.x + o.w / 2, cy = o.y + o.h / 2, rr = Math.max(o.w, o.h) * 0.95;
      const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, rr);
      g.addColorStop(0, 'rgba(255,60,60,0.45)'); g.addColorStop(1, 'rgba(255,60,60,0)');
      ctx.fillStyle = g; ctx.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
      const sc = SCENES[o.scene];
      outlined(() => o.type === 'boss' ? bossShot(o) : o.type === 'ground' ? sc.obstacle(o) : sc.flyer(o), 2, 4);
    }
    for (const p of [...players].reverse()) {
      use(p); drawNinja();
      if (state === 'ready') comicText(`${twoP ? `P${p.id + 1} ` : ''}${CHARS[p.char].name}`, p.x + 26, p.y - 66, 14, p.look.tag);
      else if (twoP && !p.dead) comicText(`P${p.id + 1}`, p.x + 26, p.y - (p.power.dragon > 0 || (p.char === 'geisha' && p.skillT > 0) ? 76 : 60), 15, p.look.tag);
    }
    drawSparks();
    drawPetals();

    for (const p of popups) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
      const pop = 1 + Math.max(0, p.life - 0.8) * 2.5;
      ctx.translate(p.x, p.y); ctx.scale(pop, pop); ctx.rotate(-0.12);
      if (p.kind === 'pow') {
        burstShape(0, 0, 30, p.color);
        comicText(p.text, 0, 7, 20, '#ffffff');
      } else {
        comicText(p.text, 0, 0, 18, p.color);
      }
      ctx.restore();
    }

    if (anyPower('slow') && state === 'running') {
      ctx.fillStyle = 'rgba(120,80,200,0.14)';
      ctx.fillRect(0, 0, W, H);
    }

    drawHUD();

    const midY = GROUND - 125;
    if (banner > 0 && state === 'running') {

      ctx.globalAlpha = Math.min(1, banner / 0.4);

      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, sceneBanner / 0.5));
      ctx.translate(W / 2, 46); ctx.rotate(-0.03);
      comicText(sc.jp, 0, 0, 30, '#ffd23f');
      comicText(sc.name, 0, 24, 18, '#ffffff');
      ctx.restore();

    if (boss && state === 'running') drawBossHUD();
    if (sceneFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, sceneFlash)})`; ctx.fillRect(0, 0, W, H); }
    if (state === 'ready') {
      ctx.save(); ctx.translate(W / 2, midY - 30); ctx.rotate(-0.04);
      comicText('NINJA DASH!', 0, 0, 54, '#ffd23f');
      comicText('忍者ダッシュ', 0, 26, 18, '#ff5a3c');
      ctx.restore();
      captionBox(twoP
        ? ['2 PLAYERS — LAST ONE STANDING WINS! — SPACE / TAP TO START', 'P1: W jump · S slide · A D move     P2: ↑ jump · ↓ slide · ← → move', 'TOUCH: LEFT HALF = P1 · RIGHT HALF = P2 · DRAG SIDEWAYS TO MOVE', 'C / V = P1 / P2 CHARACTER  ·  + / − = SPEED  ·  1 = SOLO', 'SKILLS (P1 = E · P2 = ENTER, 10s COOLDOWN): NINJA PHASES · GEISHA FLIES · SAMURAI SMASHES']
        : ['PRESS SPACE OR TAP TO START', '↑ jump  ·  ↓ slide / drop off a ledge  ·  ← → move  ·  F fullscreen  ·  M music', 'RED FLAME ORB = RIDE A DRAGON! (HOLD ↑ TO FLY)', 'C = CHARACTER (NINJA / SAMURAI / GEISHA)  ·  + / − = SPEED  ·  2 = 2 PLAYERS', 'E = SKILL (10s COOLDOWN): NINJA PHASES THROUGH · GEISHA FLIES · SAMURAI SMASHES ALL'], W / 2, midY + 60);
    } else if (state === 'over') {
      ctx.save(); ctx.translate(W / 2, midY); ctx.rotate(-0.05);
      if (twoP) {
        const [a, b] = players.map(p => Math.floor(p.score));

      } else comicText('GAME OVER!', 0, 0, 48, '#ff4d6d');
      ctx.restore();
      captionBox([twoP ? 'SPACE / TAP FOR A REMATCH  ·  1 = SOLO' : 'SPACE / TAP TO TRY AGAIN  ·  2 = 2 PLAYERS'], W / 2, midY + 34);
    }

    // comic panel border
    ctx.strokeStyle = INK; ctx.lineWidth = 8;
    ctx.strokeRect(4, 4, W - 8, H - 8);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.strokeRect(9, 9, W - 18, H - 18);
  }

  function drawFireworks() {
    for (const r of rockets) {
      if (r.delay > 0) continue;
      rect(r.x - 2, r.y - 1, 5, 10, INK);
      rect(r.x - 1, r.y, 3, 8, r.color);
      rect(r.x, r.y + 9, 1, 6, 'rgba(255,255,255,0.7)');
    }
  }

  function drawSparks() {
    for (const s of sparks) {
      ctx.globalAlpha = Math.max(0, s.life);
      rect(s.x - 2, s.y - 2, 4, 4, INK);
      rect(s.x - 1, s.y - 1, 2, 2, s.color);
    }
    ctx.globalAlpha = 1;
  }

  let uiState = null;
  function loop(t) {
    const dt = Math.min(0.033, (t - (last ?? t)) / 1000);
    last = t;
    if (state !== uiState) { uiState = state; syncButtons(); }
    syncSkillButtons();
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  reset(); state = 'ready';
  initScenery();
  requestAnimationFrame(loop);
})();
</script>
<script src="../touch-controls.js"></script>
<script>
TouchControls({
  back: 'top-left',
  bottom: 72,
  zones: [
    { side: 'left',  when: () => !(document.getElementById('mode').textContent.trim() === '2P'), items: [ { label: '◀', code: 'KeyA', title: 'Move left' }, { label: '▶', code: 'KeyD', title: 'Move right' } ] },
    { side: 'right', when: () => !(document.getElementById('mode').textContent.trim() === '2P'), items: [ { label: 'Slide', code: 'KeyS' }, { label: 'Jump', code: 'KeyW', big: true } ] },
    { side: 'left',  when: () => document.getElementById('mode').textContent.trim() === '2P', items: [ { label: '◀', code: 'KeyA', mid: true }, { label: '▶', code: 'KeyD', mid: true }, { label: 'Slide', code: 'KeyS', mid: true }, { label: 'Jump', code: 'KeyW', mid: true } ] },
    { side: 'right', when: () => document.getElementById('mode').textContent.trim() === '2P', items: [ { label: '◀', code: 'ArrowLeft', mid: true }, { label: '▶', code: 'ArrowRight', mid: true }, { label: 'Slide', code: 'ArrowDown', mid: true }, { label: 'Jump', code: 'ArrowUp', mid: true } ] },
  ],
});
</script>
