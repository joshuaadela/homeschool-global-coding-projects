'use strict';
/* =========================================================
   DINO SMASH — humans vs dinosaurs hack & slash
   Change the hero names here:
   ========================================================= */
const HERO_NAMES = ['Aldie', 'Briel'];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1280, H = 720; cv.width = W; cv.height = H;
function fit(){ const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px'; cv.style.marginTop = ((innerHeight - H*s) / 2) + 'px'; }
addEventListener('resize', fit); fit();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------------- INPUT ---------------- */
const keys = {}, pressed = {};
addEventListener('keydown', e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Slash'].includes(e.code)) e.preventDefault();
  audioInit();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = mouse.right = false; });
const mouse = { x: W/2, y: H/2, down: false, right: false, clicked: false, used: false };
function mpos(e){ const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; }
cv.addEventListener('mousemove', e => { mpos(e); mouse.used = true; });
cv.addEventListener('mousedown', e => { mpos(e); audioInit(); if (e.button === 2) mouse.right = true; else { mouse.down = true; mouse.clicked = true; } });
addEventListener('mouseup', e => { if (e.button === 2) mouse.right = false; else mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

const CTRL = {
  solo: { up:['KeyW','ArrowUp'], down:['KeyS','ArrowDown'], left:['KeyA','ArrowLeft'], right:['KeyD','ArrowRight'], atk:['Space','KeyJ'], dash:['ShiftLeft','ShiftRight','KeyK'], mouse:true },
  p1:   { up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'], atk:['Space','KeyF'], dash:['ShiftLeft','KeyG'], mouse:false },
  p2:   { up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'], atk:['Enter','Slash'], dash:['ShiftRight','Period'], mouse:false },
};
const any = arr => arr.some(k => keys[k]);

/* ---------------- AUDIO ---------------- */
let AC = null, muted = false;
function audioInit(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'square', vol = 0.1, slide = 0){
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, freq = 1000){
  if (!AC || muted) return;
  const t = AC.currentTime, len = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
}
let lastPick = 0;
const sfx = {
  shoot: h => { tone(h ? 480 : 720, 0.08, 'triangle', 0.05, -300); noise(0.05, 0.05, 3000); },
  hit:   () => { noise(0.08, 0.28, 900); tone(140, 0.1, 'square', 0.06, -70); },
  crit:  () => { noise(0.1, 0.3, 1400); tone(500, 0.12, 'square', 0.07, 300); },
  bone:  () => { const n = performance.now(); if (n - lastPick < 45) return; lastPick = n; tone(880 + Math.random()*200, 0.06, 'triangle', 0.06); },
  item:  () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'triangle', 0.12), i * 70)),
  heal:  () => { tone(440, 0.1, 'sine', 0.1, 220); },
  hurt:  () => tone(220, 0.22, 'sawtooth', 0.12, -140),
  roar:  () => { tone(95, 0.9, 'sawtooth', 0.18, -50); noise(0.9, 0.25, 350); },
  die:   () => tone(320, 0.25, 'square', 0.06, -260),
  buy:   () => { tone(880, 0.08, 'square', 0.07); setTimeout(() => tone(1320, 0.12, 'square', 0.07), 70); },
  deny:  () => tone(150, 0.2, 'square', 0.08),
  dash:  () => noise(0.15, 0.12, 600),
  spit:  () => tone(520, 0.16, 'sine', 0.08, -320),
  thud:  () => { noise(0.25, 0.35, 220); tone(60, 0.25, 'sine', 0.2, -30); },
  screech: () => tone(1300, 0.22, 'sawtooth', 0.04, -700),
  wave:  () => [392, 523, 659].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'square', 0.07), i * 110)),
};

/* ---------------- DINO VOICES ---------------- */
function growl(f, dur, vol, o = {}){
  if (!AC || muted) return;
  const { wave = 'sawtooth', slide = 0, vib = 0, vibRate = 20, cutoff = 1200, noiseVol = 0, q = 1 } = o;
  const t = AC.currentTime, osc = AC.createOscillator();
  osc.type = wave; osc.frequency.setValueAtTime(f, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = vibRate; lg.gain.value = vib * f; lfo.connect(lg); lg.connect(osc.frequency);
  const flt = AC.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = cutoff; flt.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.05, dur * 0.2)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(flt); flt.connect(g); g.connect(AC.destination);
  osc.start(t); lfo.start(t); osc.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  if (noiseVol) noise(dur, noiseVol, cutoff * 0.6);
}
const DINO_VOICES = {
  compy:   k => growl(k === 'die' ? 1800 : 1500, k === 'die' ? 0.15 : 0.08, 0.05, { wave:'square', slide: k === 'die' ? 0.5 : 1.5, cutoff:5000 }),
  raptor:  k => k === 'die' ? growl(800, 0.4, 0.08, { slide:0.35, vib:0.1, vibRate:30, cutoff:3500 })
                            : growl(k === 'attack' ? 1100 : 700, k === 'attack' ? 0.3 : 0.18, 0.07, { slide: k === 'attack' ? 1.5 : 1.2, vib:0.12, vibRate:40, cutoff:3500 }),
  pachy:   k => k === 'attack' ? growl(260, 0.25, 0.09, { slide:1.5, cutoff:1800 }) : growl(320, 0.28, 0.08, { slide:0.55, vib:0.08, vibRate:20, cutoff:1800 }),
  dilo:    k => { if (k === 'attack') { noise(0.4, 0.1, 6000); growl(420, 0.35, 0.05, { vib:0.2, vibRate:18, cutoff:2000 }); }
                  else growl(500, 0.3, 0.07, { slide: k === 'die' ? 0.4 : 0.8, vib:0.1, vibRate:25, cutoff:2500 }); },
  ptera:   k => growl(k === 'die' ? 1000 : 1400, 0.3, 0.05, { slide:0.5, vib:0.05, vibRate:50, cutoff:5000 }),
  trike:   k => growl(k === 'die' ? 70 : 90, k === 'attack' ? 0.7 : 0.45, 0.16, { slide: k === 'die' ? 0.6 : 0.85, vib:0.06, vibRate:9, cutoff:700, noiseVol:0.06 }),
  parasaur:k => { const a = k === 'attack', d = a ? 1.0 : 0.5;
                  growl(a ? 175 : 150, d, 0.13, { vib:0.03, vibRate:6, cutoff:900, q:6, slide: k === 'die' ? 0.6 : 0 });
                  growl(a ? 262 : 225, d, 0.06, { wave:'square', vib:0.03, vibRate:6, cutoff:1200, slide: k === 'die' ? 0.6 : 0 }); },
  ankylo:  k => growl(100, 0.4, 0.15, { slide:0.75, vib:0.08, vibRate:14, cutoff:550, noiseVol:0.07 }),
  stego:   k => growl(120, 0.35, 0.14, { slide:0.7, vib:0.05, vibRate:12, cutoff:600, noiseVol:0.05 }),
  brachio: k => { growl(55, 1.2, 0.22, { wave:'sine', slide:0.8, vib:0.04, vibRate:5, cutoff:400 }); growl(110, 1.1, 0.08, { slide:0.8, vib:0.04, vibRate:5, cutoff:500 }); },
  rex:     k => { const big = k !== 'hurt';
                  growl(70, big ? 1.1 : 0.4, 0.22, { slide:0.6, vib:0.15, vibRate:28, cutoff:900, noiseVol: big ? 0.2 : 0.08 });
                  growl(140, big ? 1.0 : 0.35, 0.1, { slide:0.55, vib:0.2, vibRate:31, cutoff:1400 }); },
  spino:   k => { const big = k !== 'hurt';
                  growl(90, big ? 0.9 : 0.35, 0.18, { slide:0.7, vib:0.12, vibRate:22, cutoff:1100, noiseVol: big ? 0.15 : 0.05 });
                  growl(300, big ? 0.6 : 0.25, 0.06, { slide:0.5, vib:0.2, vibRate:40, cutoff:2500 }); },
};
const voiceCd = {}; let voiceGlobal = 0;
function voice(type, kind){
  if (!AC || muted) return;
  const now = AC.currentTime, key = type + kind;
  if ((voiceCd[key] || 0) > now) return;
  if (kind !== 'attack' && kind !== 'die' && voiceGlobal > now) return;
  voiceCd[key] = now + (kind === 'hurt' ? 0.35 : kind === 'spawn' ? 0.5 : 0.12); voiceGlobal = now + 0.08;
  DINO_VOICES[type] && DINO_VOICES[type](kind);
}

/* ---------------- MUSIC (procedural tribal jungle loop) ---------------- */
let musicBus = null, mNext = 0, mStep = 0, noiseBuf = null;
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const MELODY = [
  69,0,0,72, 0,0,74,0, 76,0,0,74, 0,72,0,0,
  69,0,0,0,  67,0,69,0, 0,0,0,0,  0,0,0,0,
  65,0,0,69, 0,0,72,0, 74,0,0,72, 0,69,0,0,
  67,0,0,71, 0,0,74,0, 76,0,74,0, 71,0,67,0 ];
const ROOTS = [45, 45, 41, 43];
function getNoise(){ if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } return noiseBuf; }
function mOsc(type, f, t, dur, vol, fEnd){
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + dur + 0.02);
}
function mNoise(t, dur, vol, freq){
  const s = AC.createBufferSource(); s.buffer = getNoise(); const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(musicBus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function musicMode(){
  if (state === 'title') return 'title';
  if (state === 'shop') return 'shop';
  return enemies.some(e => e.boss) ? 'boss' : 'battle';
}
function playStep(s, t, mode, sp){
  const b = s % 16, root = ROOTS[Math.floor(s / 16)];
  const fight = mode === 'battle' || mode === 'boss', boss = mode === 'boss';
  if (fight && [0, 4, 8, 10, 12].includes(b)) mOsc('sine', 150, t, 0.18, 0.55, 40);
  if (boss && (b === 14 || b === 15)) mOsc('sine', 150, t, 0.12, 0.4, 40);
  if ([2, 7, 13, 15].includes(b) && mode !== 'shop') mOsc('sine', b % 2 ? 130 : 185, t, 0.2, fight ? 0.3 : 0.18, b % 2 ? 80 : 110);
  if (fight ? b % 2 === 1 : b % 4 === 2) mNoise(t, 0.04, fight ? 0.05 : 0.03, 7000);
  if ([0, 3, 6, 8, 10, 14].includes(b)) {
    const n = b === 10 ? root + 12 : root;
    mOsc('triangle', midi(n), t, sp * 2.2, mode === 'shop' ? 0.16 : 0.22);
    if (fight) mOsc('sawtooth', midi(n), t, sp * 1.5, 0.03);
  }
  if (boss && b % 4 === 0) { mOsc('sawtooth', midi(root + 24), t, sp * 1.2, 0.035); mOsc('sawtooth', midi(root + 31), t, sp * 1.2, 0.03); }
  const m = MELODY[s];
  if (m && !boss) { mOsc('triangle', midi(m), t, sp * 3.5, mode === 'battle' ? 0.06 : 0.08); mOsc('sine', midi(m + 12), t, sp * 2, 0.015); }
  if (m && boss) mOsc('square', midi(m - 12), t, sp * 2, 0.03);
}
function musicTick(){
  if (!AC || AC.state !== 'running') return;
  if (!musicBus) { musicBus = AC.createGain(); musicBus.connect(AC.destination); }
  musicBus.gain.value = muted ? 0 : 0.35;
  if (muted || state === 'paused' || state === 'over') { mNext = 0; return; }
  const mode = musicMode(), bpm = { title:100, shop:92, battle:126, boss:152 }[mode], sp = 60 / bpm / 4;
  if (mNext < AC.currentTime) mNext = AC.currentTime + 0.05;
  while (mNext < AC.currentTime + 0.15) { playStep(mStep, mNext, mode, sp); mNext += sp; mStep = (mStep + 1) % 64; }
}

  brachio: { name:'Brachiosaurus',  hp:420, speed:40,  dmg:24, r:36, bones:14, kbRes:0.97, item:0.5,  fav:'amber',   C:'#8e9eab', D:'#546e7a', L:'#eceff1', h:85 },
  rex:     { name:'T-Rex',          hp:900, speed:95,  dmg:30, r:44, bones:45, kbRes:0.92, item:1,    fav:'tooth',   C:'#7b5a35', D:'#4a3520', L:'#c8a97e', boss:true },

/* ---------------- STATE ---------------- */
let state = 'title', numPlayers = 1, wave = 0, kills = 0, time = 0;
let team = { bones:0, weapon:0, armor:0, mystery:40 };
let players = [], enemies = [], projectiles = [], arrows = [], pickups = [], particles = [], texts = [], rings = [], toasts = [];
let spawnQueue = [], spawnTimer = 0, clearTimer = -1, overTimer = -1, magnetAll = false;
let shake = 0, hitstop = 0, banner = null, shopMsg = null, uiButtons = [];
let best = 0; try { best = +localStorage.getItem('dinoSmashBest') || 0; } catch (e) {}

function makePlayer(i, ctrl){
  return { id:i, name:HERO_NAMES[i], color: i ? '#ec407a' : '#1e88e5', hair: i ? '#5d3317' : '#f2c14e',
    x: W/2 + (numPlayers > 1 ? (i ? 50 : -50) : 0), y: H/2 + 40, r:15, hp:100, maxHp:100, aim:0, face:1, ctrl,
    atkT:0, atkCd:0, shot:0,
    dashT:0, dashCd:0, dashX:0, dashY:0, inv:0, dead:false, walk:0,
    items: Object.fromEntries(ITEM_KEYS.map(k => [k, 0])) };
}
function stats(p){
  const it = p.items, w = WEAPONS[team.weapon];
  return { dmg: w.dmg + it.tooth * 4, atkSpd: Math.min(2.6, 1 + it.claw * 0.12), speed: 230 * Math.min(1.9, 1 + it.feather * 0.08),
    armor: ARMORS[team.armor].def + it.scale * 2, range: w.range * (1 + it.horn * 0.12), kb: 1 + it.horn * 0.25,
    burn: it.ember * 8, leech: it.fang * 2, luck: it.fossil };
}

/* ---------------- SAVE / LOAD ---------------- */
const SAVE_KEY = 'dinoSmashSave';
let saveData = null, saveOk = true, savedFlash = 0;
function saveGame(){
  const data = { v:1, numPlayers, wave, kills, when:Date.now(), team:{ ...team },
    players: players.map(p => ({ hp:Math.ceil(p.hp), maxHp:p.maxHp, items:{ ...p.items } })) };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); saveData = data; saveOk = true; savedFlash = 2.5; }
  catch (e) { saveOk = false; }
}
function loadSave(){
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (d && d.v === 1 && d.wave > 0) return d; } catch (e) {}
  return null;
}
function clearSave(){ saveData = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
saveData = loadSave();
function continueGame(){ const d = loadSave(); if (d) startGame(d.numPlayers, d); }

function startGame(n, save){
  numPlayers = n; wave = 0; kills = 0;
  team = { bones:0, weapon:0, armor:0, mystery:40 };
  players = n === 1 ? [makePlayer(0, CTRL.solo)] : [makePlayer(0, CTRL.p1), makePlayer(1, CTRL.p2)];
  enemies = []; projectiles = []; arrows = []; pickups = []; particles = []; texts = []; rings = []; toasts = [];
  spawnQueue = []; overTimer = -1; clearTimer = -1; banner = null; state = 'play';
  if (save) {
    wave = save.wave; kills = save.kills || 0; Object.assign(team, save.team);

          shake = Math.max(shake, 10); sfx.thud(); e.state = 'rest'; e.st = 0.7;
        }
      } else { towards(); if (e.cd <= 0 && e.inArena && td < 360) { e.state = 'stompw'; e.st = 0.85; voice('brachio', 'attack'); } }
      break;
    case 'rex': case 'spino': {
      const spino = e.type === 'spino', enr = e.hp < e.maxHp * 0.5;
      if (e.state === 'chase') {
        towards(); sp = e.speed * (enr ? 1.3 : 1);
        if (e.cd <= 0 && e.inArena && t) {
          const r = Math.random();
          voice(e.type, 'attack');
          if (r < 0.38) { e.state = 'aim'; e.st = spino ? 0.55 : 0.7; e.dir = ang; }
          else if (r < 0.72) {
            if (spino) { if (td < 220) { e.state = 'spin'; e.st = 0.5; e.spinR = 160; } else { e.state = 'volley'; e.st = 0.6; } }
            else { e.state = 'stompw'; e.st = 0.6; }
          } else {
            e.state = 'roar'; e.st = 1.0; shake = Math.max(shake, 12);
            const n = 3 + Math.floor(wave / 5);
            for (let i = 0; i < n; i++) spawned.push(makeEnemy(spino ? (i % 2 ? 'dilo' : 'compy') : (i === 0 && wave >= 10 ? 'raptor' : i === 1 ? 'pachy' : 'compy')));
            addText(e.x, e.y - 130, spino ? 'SKRAAAAH!' : 'ROOAAARR!', '#ffab40', 30, 1.2);
          }
        }
      } else if (e.state === 'aim') { sp = 0; if (e.st > 0.2) e.dir = ang; if (e.st <= 0) { e.state = 'charge'; e.st = spino ? 0.75 : 1.0; } }
      else if (e.state === 'charge') { mvx = Math.cos(e.dir); mvy = Math.sin(e.dir); sp = spino ? 640 : 560; if (Math.random() < dt * 40) burst(e.x, e.y, '#a1887f', 1, 80, 6, 0.5); if (e.st <= 0) { e.state = 'rest'; e.st = 0.5; } }
      else if (e.state === 'stompw') {
        sp = 0;
        if (e.st <= 0) {
          const n = enr ? 3 : 2;
          for (let i = 0; i < n; i++) rings.push({ x:e.x, y:e.y, r:e.r - i * 140, max:480, speed:400, dmg:e.dmg * 0.8, hit:new Set(), color:'#ffab40' });
          shake = Math.max(shake, 14); sfx.thud(); e.state = 'rest'; e.st = 0.45;
        }
      } else if (e.state === 'spin') {
        sp = 0;
        if (e.st <= 0) {
          rings.push({ x:e.x, y:e.y, r:20, max:160, speed:600, dmg:0, hit:new Set(), color:'#81d4fa' });
          for (const p of players) if (!p.dead && Math.hypot(p.x - e.x, p.y - e.y) < 160) damagePlayer(p, e.dmg * 1.1, e);
          shake = Math.max(shake, 8); sfx.thud(); e.state = 'rest'; e.st = 0.4;
        }
      } else if (e.state === 'volley') {
        sp = 0;
        if (e.st <= 0) {
          const n = enr ? 9 : 7;
          for (let i = 0; i < n; i++) { const a = ang + (i - (n - 1) / 2) * 0.16;
            projectiles.push({ x:e.x + Math.cos(a) * 40, y:e.y - 10 + Math.sin(a) * 40, vx:Math.cos(a) * 330, vy:Math.sin(a) * 330, r:9, dmg:e.dmg * 0.6, life:3, color:'#4fc3f7' }); }
          sfx.spit(); e.state = 'rest'; e.st = 0.5;
        }
      } else if (e.state === 'roar') { sp = 0; if (e.st <= 0) { e.state = 'chase'; e.cd = rand(1.2, 2.2); } }
      break;
    }
  }
  // dinos still outside the arena always walk in (so nobody hides off-screen and blocks the wave)
  if (!e.inArena) { const ca = Math.atan2(clamp(ty, 120, H - 60) - e.y, clamp(tx, 80, W - 80) - e.x); mvx = Math.cos(ca); mvy = Math.sin(ca); sp = Math.max(sp, e.speed); }
  if (e.rage > 0) { e.rage -= dt; sp *= 1.35; if (Math.random() < dt * 8) particles.push({ x:e.x + rand(-e.r, e.r), y:e.y - rand(0, e.r * 2), vx:0, vy:-50, life:0.4, max:0.4, color:'#ff1744', size:3 }); }
  e.x += mvx * sp * dt; e.y += mvy * sp * dt;
  if (sp > 0 && Math.abs(mvx) > 0.1) e.face = mvx > 0 ? 1 : -1;
  else if (sp === 0 && t) e.face = tx > e.x ? 1 : -1;
  if (sp > 0) e.anim += sp * dt * 0.07;

  if (!e.inArena) { if (e.x > 40 && e.x < W - 40 && e.y > 85 && e.y < H - 25) e.inArena = true; }
  else {
    const ox = e.x, oy = e.y; e.x = clamp(e.x, 30, W - 30); e.y = clamp(e.y, 80, H - 18);
    if ((ox !== e.x || oy !== e.y) && e.state === 'charge') {
      e.state = 'stun'; e.st = 0.9; shake = Math.max(shake, 9); sfx.thud(); burst(e.x, e.y - e.r, '#bcaaa4', 16, 220, 6, 0.6);
      addText(e.x, e.y - e.r * 2.5, 'BONK!', '#fff59d', 22);
    }
  }
  for (const p of players) {
    if (p.dead || e.contactCd > 0) continue;
    if (e.type === 'ptera' && e.state !== 'swoop') continue;
    if (Math.hypot(p.x - e.x, p.y - e.y) < e.r + p.r) {
      const m = (e.state === 'charge' || e.state === 'lunge' || e.state === 'swoop') ? 1.5 : 1 * (e.rage > 0 ? 1.25 : 1);
      if (damagePlayer(p, e.dmg * m, e)) e.contactCd = 0.6;
    }
  }
}

function updatePlay(dt){
  // spawning
  spawnTimer -= dt;
  if (spawnQueue.length && spawnTimer <= 0 && enemies.length < 34) {
    const type = spawnQueue.shift(), ne = makeEnemy(type); enemies.push(ne);
    if (type === 'rex') { banner = { text:'T-REX!', sub:'Dodge the charge & the stomp shockwaves!', t:2.6 }; voice('rex', 'attack'); shake = 14; }
    else if (type === 'spino') { banner = { text:'SPINOSAURUS!', sub:'Beware its water-spit volley & tail sweep!', t:2.6 }; voice('spino', 'attack'); shake = 14; }
    else if (ne.elite) { voice(type, 'attack'); toast('An ALPHA ' + DINOS[type].name + ' appeared!', '#ffd54f'); }
    else if (Math.random() < 0.5) voice(type, 'spawn');
    spawnTimer = Math.max(0.22, 0.9 - wave * 0.05) * (type === 'compy' ? 0.3 : 1);
  }
  for (const p of players) updatePlayer(p, dt);
  updateArrows(dt);
  const spawned = [];
  for (const e of enemies) if (!e.dead) updateEnemy(e, dt, spawned);
  enemies.push(...spawned);
  // separation
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j]; if (a.type === 'ptera' || b.type === 'ptera') continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = (a.r + b.r) * 0.85;
    if (d < m && d > 0.01) { const push = (m - d) / 2, nx = dx / d, ny = dy / d, wa = 1 - a.kbRes * 0.8, wb = 1 - b.kbRes * 0.8;
      a.x -= nx * push * wa; a.y -= ny * push * wa; b.x += nx * push * wb; b.y += ny * push * wb; }
  }
  enemies = enemies.filter(e => !e.dead);
  // projectiles
  for (const pr of projectiles) {
    pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.life -= dt;
    if (Math.random() < dt * 30) particles.push({ x:pr.x, y:pr.y, vx:0, vy:0, life:0.25, max:0.25, color:'#9ccc65', size:4 });
    for (const p of players) if (!p.dead && pr.life > 0 && Math.hypot(p.x - pr.x, p.y - 10 - pr.y) < pr.r + p.r) {
      if (damagePlayer(p, pr.dmg, pr)) { pr.life = 0; burst(pr.x, pr.y, '#b2ff59', 10, 160, 4, 0.4); }
    }
    if (pr.x < -50 || pr.x > W + 50 || pr.y < -50 || pr.y > H + 50) pr.life = 0;
  }
  projectiles = projectiles.filter(p => p.life > 0);
  // shockwave rings
  for (const r of rings) {
    r.r += r.speed * dt;
    if (r.dmg && r.r > 0) for (const p of players) {
      if (p.dead || r.hit.has(p)) continue;
      if (Math.abs(Math.hypot(p.x - r.x, (p.y - r.y) * 1.4) - r.r) < 18) { r.hit.add(p); damagePlayer(p, r.dmg, r); }
    }
  }
  rings = rings.filter(r => r.r < r.max);
  // pickups
  for (const pk of pickups) {
    pk.t += dt; const f = Math.exp(-4 * dt); pk.vx *= f; pk.vy *= f; pk.x += pk.vx * dt; pk.y += pk.vy * dt;
    pk.vz -= 700 * dt; pk.z += pk.vz * dt; if (pk.z < 0) { pk.z = 0; pk.vz = -pk.vz * 0.4; if (Math.abs(pk.vz) < 30) pk.vz = 0; }
    pk.x = clamp(pk.x, 30, W - 30); pk.y = clamp(pk.y, 80, H - 18);
    const [p, d] = nearestPlayer(pk);
    if (!p || pk.t < 0.35) continue;
    const isItem = ITEMS[pk.type];
    if (magnetAll || d < (isItem ? 70 : 110)) { const a = Math.atan2(p.y - pk.y, p.x - pk.x), s = magnetAll ? 750 : 430; pk.x += Math.cos(a) * s * dt; pk.y += Math.sin(a) * s * dt; }
    if (d < p.r + 14) { pk.dead = true; collect(pk, p); }
  }
  pickups = pickups.filter(p => !p.dead);

  // wave clear
  if (!spawnQueue.length && !enemies.length && clearTimer < 0 && overTimer < 0) {
    clearTimer = 2.2; magnetAll = true;
    banner = { text:'WAVE ' + wave + ' CLEAR!', sub:'Collecting loot...', t:2 };
    for (const p of players) if (p.dead) { p.dead = false; p.hp = Math.ceil(p.maxHp / 2); p.inv = 1.5; toast(p.name + ' is back in the fight!', '#69f0ae'); }
  }
  if (clearTimer >= 0) { clearTimer -= dt; if (clearTimer < 0 && !pickups.length) { state = 'shop'; shopMsg = null; saveGame(); } else if (clearTimer < 0) clearTimer = 0.01; }
  // game over
  if (overTimer < 0 && players.every(p => p.dead)) overTimer = 1.8;
  if (overTimer >= 0) { overTimer -= dt; if (overTimer < 0) { state = 'over'; if (wave > best) { best = wave; try { localStorage.setItem('dinoSmashBest', best); } catch (e) {} } } }
}

function updateFx(dt){
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; const f = Math.exp(-3 * dt); p.vx *= f; p.vy *= f; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const t of texts) { t.y -= 45 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  for (const t of toasts) t.t -= dt;
  toasts = toasts.filter(t => t.t > 0);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (shopMsg) { shopMsg.t -= dt; if (shopMsg.t <= 0) shopMsg = null; }
  savedFlash = Math.max(0, savedFlash - dt);
  shake = Math.max(0, shake - dt * 30);
}

/* ---------------- SHOP ---------------- */
function getShop(){
  const cw = WEAPONS[team.weapon], nw = WEAPONS[team.weapon + 1], na = ARMORS[team.armor + 1], hurt = players.some(p => p.hp < p.maxHp);
  return [
    { icon:'weapon', title:'Upgrade Bow', l1: nw ? nw.name : 'Maxed out!', l2: nw ? `Damage ${cw.dmg} → ${nw.dmg}` + (nw.shots > cw.shots ? ` · ${nw.shots} arrows` : '') : '', cost: nw ? nw.cost : null,
      act: () => { team.weapon++; toast('Team bow upgraded to ' + WEAPONS[team.weapon].name + '!', '#ffd54f'); } },
    { icon:'armor', title:'Craft Armor', l1: na ? na.name : 'Maxed out!', l2: na ? `Armor ${ARMORS[team.armor].def} → ${na.def}` : '', cost: na ? na.cost : null,
      act: () => { team.armor++; toast('Team armor upgraded to ' + ARMORS[team.armor].name + '!', '#ffd54f'); } },
    { icon:'meat', title:'Meat Feast', l1:'Heal everyone to full', l2: hurt ? '' : '(Everyone is healthy)', cost: hurt ? 8 + wave * 2 : null,
      act: () => players.forEach(p => p.hp = p.maxHp) },
    { icon:'fossil', title:'Mystery Fossil', l1:'Crack it open for a', l2:'random dino item!', cost: team.mystery,
      act: () => { const p = players.slice().sort((a, b) => Object.values(a.items).reduce((s, v) => s + v, 0) - Object.values(b.items).reduce((s, v) => s + v, 0))[0];
        giveItem(p, pick(ITEM_KEYS)); team.mystery += 25; } },
  ];
}
function buyShop(i){
  const o = getShop()[i]; if (!o || o.cost == null) return;
  if (team.bones < o.cost) { sfx.deny(); shopMsg = { txt:'Not enough bones! Smash more dinos.', t:1.6 }; return; }
  team.bones -= o.cost; o.act(); sfx.buy(); saveGame();
}

/* ---------------- MAIN UPDATE ---------------- */
function clickedBtn(){
  if (!mouse.clicked) return null;
  for (const b of uiButtons) if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) return b.id;
  return null;
}
function update(dt){
  time += dt;
  if (pressed.KeyM) muted = !muted;
  const btn = clickedBtn();
  if (state === 'title') {
    if (pressed.Digit1 || pressed.Numpad1 || btn === 'p1') startGame(1);
    else if (pressed.Digit2 || pressed.Numpad2 || btn === 'p2') startGame(2);
    else if (saveData && (pressed.KeyC || btn === 'cont')) continueGame();
  } else if (state === 'play') {
    if (pressed.KeyP || pressed.Escape) { state = 'paused'; return; }
    updatePlay(dt);
  } else if (state === 'paused') {
    if (pressed.KeyP || pressed.Escape || btn === 'resume') state = 'play';
    if (btn === 'quit') { state = 'title'; saveData = loadSave(); }
  } else if (state === 'shop') {
    ['Digit1','Digit2','Digit3','Digit4'].forEach((k, i) => { if (pressed[k]) buyShop(i); });
    if (btn && btn.startsWith('shop')) buyShop(+btn.slice(4));
    if (pressed.KeyN || btn === 'next') { state = 'play'; startWave(); }
  } else if (state === 'over') {
    if (saveData && (pressed.KeyC || btn === 'cont')) continueGame();
    else if (pressed.KeyR || btn === 'retry') startGame(numPlayers);
    else if (pressed.KeyT || btn === 'title') { state = 'title'; saveData = loadSave(); }
  }
  updateFx(dt);
}

/* ---------------- DRAW HELPERS ---------------- */
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ell(x, y, rx, ry, rot = 0){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); }
function line(x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function txt(s, x, y, size, color, align = 'center', stroke = true){
  ctx.font = `800 ${size}px system-ui, -apple-system, Segoe UI, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

// pre-rendered jungle arena
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(function(){
  const b = bg.getContext('2d');
  const g = b.createRadialGradient(W/2, H/2, 100, W/2, H/2, 800); g.addColorStop(0, '#6a8f45'); g.addColorStop(1, '#3f6530');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++) { b.fillStyle = `rgba(110,85,50,${rand(0.12, 0.3)})`; b.beginPath(); b.ellipse(rand(0, W), rand(0, H), rand(30, 110), rand(15, 50), rand(0, 3), 0, TAU); b.fill(); }
  for (let i = 0; i < 900; i++) { const x = rand(0, W), y = rand(0, H); b.strokeStyle = Math.random() < 0.5 ? 'rgba(40,80,25,.55)' : 'rgba(150,190,90,.45)'; b.lineWidth = 1.5;
    b.beginPath(); b.moveTo(x, y); b.lineTo(x + rand(-3, 3), y - rand(4, 9)); b.stroke(); }
  for (let i = 0; i < 26; i++) { const x = rand(40, W-40), y = rand(90, H-30), r = rand(4, 11); b.fillStyle = '#7d7366'; b.beginPath(); b.ellipse(x, y, r * 1.3, r, 0, 0, TAU); b.fill(); b.fillStyle = '#a39888'; b.beginPath(); b.ellipse(x - r*0.3, y - r*0.3, r*0.6, r*0.4, 0, 0, TAU); b.fill(); }
  // bones & footprints decor
  for (let i = 0; i < 8; i++) { const x = rand(80, W-80), y = rand(120, H-60); b.save(); b.translate(x, y); b.rotate(rand(0, 3)); b.fillStyle = 'rgba(240,230,200,.55)'; b.fillRect(-10, -2, 20, 4); b.beginPath(); b.arc(-10, -2, 3, 0, TAU); b.arc(-10, 2, 3, 0, TAU); b.arc(10, -2, 3, 0, TAU); b.arc(10, 2, 3, 0, TAU); b.fill(); b.restore(); }
  // jungle border
  const tree = (x, y, r) => { b.fillStyle = '#1f3d1a'; b.beginPath(); b.arc(x, y, r, 0, TAU); b.fill(); b.fillStyle = '#2f5a26'; b.beginPath(); b.arc(x - r*0.25, y - r*0.25, r*0.7, 0, TAU); b.fill(); b.fillStyle = '#3f7332'; b.beginPath(); b.arc(x - r*0.35, y - r*0.4, r*0.35, 0, TAU); b.fill(); };
  for (let x = -20; x < W + 40; x += rand(35, 60)) { tree(x, rand(-10, 25), rand(30, 48)); tree(x + 20, H + rand(0, 25), rand(26, 40)); }
  for (let y = 0; y < H + 40; y += rand(35, 60)) { tree(rand(-25, -5), y, rand(28, 45)); tree(W + rand(5, 25), y, rand(28, 45)); }
  // ferns
  for (let i = 0; i < 40; i++) { const side = i % 4; let x, y;
    if (side === 0) { x = rand(0, W); y = rand(55, 85); } else if (side === 1) { x = rand(0, W); y = rand(H-20, H); } else if (side === 2) { x = rand(20, 45); y = rand(60, H); } else { x = rand(W-45, W-20); y = rand(60, H); }
    b.strokeStyle = '#4c8a3a'; b.lineWidth = 3; for (let k = 0; k < 5; k++) { const a = -Math.PI/2 + (k - 2) * 0.45; b.beginPath(); b.moveTo(x, y); b.quadraticCurveTo(x + Math.cos(a) * 10, y + Math.sin(a) * 18, x + Math.cos(a) * 20, y + Math.sin(a) * 14); b.stroke(); } }
})();

// bow drawn pointing along +x; pull = 0..1 how far the string is drawn back
function drawBow(tier, pull = 0){
  const w = WEAPONS[tier], R = 15 + tier * 2, cx = -R * 0.5, A = 1.1;
  const tx = cx + Math.cos(A) * R, ty = Math.sin(A) * R, sx = tx - pull * 10;
  ctx.lineCap = 'round';
  // nocked arrow
  if (pull > 0.2) drawArrow(false, false, tier === 4, sx + 12);
  ctx.strokeStyle = tier === 4 ? '#b2ffff' : '#eeeeee'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(tx, -ty); ctx.lineTo(sx, 0); ctx.lineTo(tx, ty); ctx.stroke();
  if (tier === 4) { ctx.shadowColor = '#18ffff'; ctx.shadowBlur = 14; }
  ctx.strokeStyle = w.color; ctx.lineWidth = tier >= 2 ? 4.5 : 4; ctx.beginPath(); ctx.arc(cx, 0, R, -A, A); ctx.stroke();
  if (tier === 3) { ctx.beginPath(); ctx.arc(cx - 4, 0, R, -A * 0.8, A * 0.8); ctx.stroke(); }
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#4e342e'; ctx.fillRect(cx + R - 3, -4, 5, 8);
}
// arrow pointing along +x, centered at offset ox
function drawArrow(heavy, fire, plasma, ox = 0){
  const L = heavy ? 30 : 22;
  ctx.save(); ctx.translate(ox, 0);
  if (heavy || plasma || fire) { ctx.shadowColor = plasma ? '#18ffff' : fire ? '#ff7043' : '#fff'; ctx.shadowBlur = 10; }
  ctx.strokeStyle = plasma ? '#80ffff' : '#8d6e63'; ctx.lineWidth = heavy ? 3 : 2; line(-L / 2, 0, L / 2, 0);
  ctx.fillStyle = plasma ? '#e0ffff' : fire ? '#ffab40' : '#cfd8dc';
  ctx.beginPath(); ctx.moveTo(L / 2 + 6, 0); ctx.lineTo(L / 2 - 2, -4); ctx.lineTo(L / 2 - 2, 4); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = plasma ? '#18ffff' : '#ef5350';
  ctx.beginPath(); ctx.moveTo(-L / 2 + 4, 0); ctx.lineTo(-L / 2 - 3, -4); ctx.lineTo(-L / 2, 0); ctx.lineTo(-L / 2 - 3, 4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawHuman(p, solo = false){

  const f = p.face, bob = Math.abs(Math.sin(p.walk)) * 2.5, sw = Math.sin(p.walk) * 6;

/* ---------------- RENDER ---------------- */
function render(){
  uiButtons = [];
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.drawImage(bg, 0, 0);
  if (state === 'title') { renderTitle(); ctx.restore(); return; }

  // pickups
  for (const pk of pickups) {
    const isItem = ITEMS[pk.type], by = Math.sin(time * 4 + pk.x) * 2;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ell(pk.x, pk.y, 8, 3); ctx.fill();
    if (isItem) {
      const g = ctx.createRadialGradient(pk.x, pk.y - 12 - pk.z, 2, pk.x, pk.y - 12 - pk.z, 26);
      g.addColorStop(0, isItem.color + 'cc'); g.addColorStop(1, isItem.color + '00'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pk.x, pk.y - 12 - pk.z, 26, 0, TAU); ctx.fill();
      ctx.save(); ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 6); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      const sa = time * 2; line(pk.x + Math.cos(sa) * 18 - 3, pk.y - 12 - pk.z + Math.sin(sa) * 18, pk.x + Math.cos(sa) * 18 + 3, pk.y - 12 - pk.z + Math.sin(sa) * 18); ctx.restore();
      drawItemIcon(pk.type, pk.x, pk.y - 12 - pk.z + by, 15);
    } else drawItemIcon(pk.type, pk.x, pk.y - 6 - pk.z + by, 10);
  }
  // rings
  for (const r of rings) if (r.r > 0) { ctx.save(); ctx.globalAlpha = 1 - r.r / r.max; ctx.strokeStyle = r.color; ctx.lineWidth = 8; ell(r.x, r.y, r.r, r.r / 1.4); ctx.stroke(); ctx.restore(); }
  // target markers on each hero's locked-on dino
  for (const p of players) if (!p.dead && p.target && !p.target.dead && state === 'play') {
    const e = p.target, inRange = p.targetDist < stats(p).range + e.r + 40, rr2 = e.r * 1.3 + 4;
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(time * 2 * (p.id ? -1 : 1));
    ctx.strokeStyle = p.color; ctx.globalAlpha = inRange ? 0.9 : 0.4; ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(0, 0, rr2, i * TAU / 4 + 0.25, i * TAU / 4 + 1.2); ctx.stroke(); }
    ctx.restore();
  }
  // entities sorted by y
  const ents = [...enemies.map(e => ({ y:e.y, e })), ...players.map(p => ({ y:p.y, p }))].sort((a, b) => a.y - b.y);
  for (const o of ents) o.e ? drawDino(o.e) : drawHuman(o.p);
  // arrows
  for (const a of arrows) {
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ell(a.x, a.y, 8, 2); ctx.fill();
    ctx.save(); ctx.translate(a.x, a.y - 14); ctx.rotate(a.ang); drawArrow(a.heavy, a.fire, a.plasma); ctx.restore();
  }
  // projectiles
  for (const pr of projectiles) { const pc = pr.color || '#76ff03'; ctx.fillStyle = pc; ctx.shadowColor = pc; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, TAU); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#ccff90'; ctx.beginPath(); ctx.arc(pr.x - 2, pr.y - 2, 3, 0, TAU); ctx.fill(); }
  // particles
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size); }
  ctx.globalAlpha = 1;
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life / t.max * 2); txt(String(t.txt), t.x, t.y, t.size, t.color); }
  ctx.globalAlpha = 1;
  ctx.restore();

  renderHUD();
  if (state === 'shop') renderShop();
  if (state === 'paused') renderPause();
  if (state === 'over') renderOver();
}

function hpBar(x, y, w, h, frac, col){
  ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(x - 2, y - 2, w + 4, h + 4, 4); ctx.fill();
  ctx.fillStyle = '#3a1010'; rr(x, y, w, h, 3); ctx.fill();
  if (frac > 0) { ctx.fillStyle = col; rr(x, y, Math.max(6, w * frac), h, 3); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + 2, y + 1, Math.max(0, w * frac - 4), h * 0.35); }
}
function renderPlayerPanel(p, x, y){
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(x, y, 300, 86, 10); ctx.fill();
  ctx.strokeStyle = p.color; ctx.lineWidth = 2; rr(x, y, 300, 86, 10); ctx.stroke();
  txt(p.name, x + 12, y + 16, 17, p.color, 'left');
  txt(p.dead ? 'KNOCKED OUT' : `${Math.ceil(p.hp)} / ${p.maxHp}`, x + 288, y + 16, 13, p.dead ? '#ff8a80' : '#fff', 'right');
  hpBar(x + 12, y + 30, 276, 12, p.hp / p.maxHp, p.hp / p.maxHp > 0.35 ? '#66bb6a' : '#ef5350');
  txt(WEAPONS[team.weapon].name + '  ·  ' + ARMORS[team.armor].name, x + 12, y + 55, 12, '#e0e0e0', 'left', false);
  let ix = x + 18;
  for (const k of ITEM_KEYS) if (p.items[k]) { drawItemIcon(k, ix, y + 73, 9); txt('×' + p.items[k], ix + 10, y + 74, 11, '#fff', 'left'); ix += 32; }
  if (ix === x + 18) txt('No items yet — smash dinos!', x + 12, y + 73, 11, '#9e9e9e', 'left', false);
}
function renderHUD(){
  renderPlayerPanel(players[0], 14, 10);
  if (players[1]) renderPlayerPanel(players[1], W - 314, 10);
  // center
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(W/2 - 120, 10, 240, 70, 10); ctx.fill();
  txt('WAVE ' + wave, W/2, 30, 24, '#ffd54f');
  drawItemIcon('bone', W/2 - 70, 60, 12); txt(String(team.bones), W/2 - 52, 61, 17, '#fff', 'left');
  txt('Dinos: ' + (spawnQueue.length + enemies.length), W/2 + 95, 61, 14, '#ffab91', 'right');
  // boss bar
  const bossList = enemies.filter(e => e.boss), boss = bossList.length > 0;
  bossList.forEach((b, i) => { const y = H - 38 - i * 46; txt(DINOS[b.type].name.toUpperCase(), W/2, y - 14, 18, '#ffab40'); hpBar(W/2 - 300, y, 600, 16, b.hp / b.maxHp, b.type === 'spino' ? '#4fc3f7' : '#ff7043'); });
  // toasts
  let ty = H - (boss ? 90 + (bossList.length - 1) * 46 : 30);
  for (let i = toasts.length - 1; i >= 0; i--) { const t = toasts[i]; ctx.globalAlpha = Math.min(1, t.t); txt(t.txt, 20, ty, 15, t.color, 'left'); ty -= 24; }
  ctx.globalAlpha = 1;
  // banner
  if (banner && state === 'play') {
    const a = Math.min(1, banner.t * 2), sc = 1 + Math.max(0, banner.t - 2.2) * 0.8;
    ctx.globalAlpha = a; ctx.save(); ctx.translate(W/2, H/2 - 120); ctx.scale(sc, sc);
    txt(banner.text, 0, 0, 56, '#ffeb3b'); if (banner.sub) txt(banner.sub, 0, 46, 22, '#fff');
    ctx.restore(); ctx.globalAlpha = 1;
  }
  txt(muted ? 'M: sound & music off' : 'M: sound & music on   P: pause', W - 14, H - 14, 11, 'rgba(255,255,255,.6)', 'right', false);
}

function button(id, label, x, y, w, h, col = '#ffb300', sub){
  const hov = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  ctx.fillStyle = hov ? col : 'rgba(0,0,0,.6)'; rr(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3; rr(x, y, w, h, 12); ctx.stroke();
  txt(label, x + w/2, y + h/2 - (sub ? 9 : 0), 22, hov ? '#1a1a1a' : '#fff', 'center', !hov);
  if (sub) txt(sub, x + w/2, y + h/2 + 15, 13, hov ? '#333' : '#ddd', 'center', false);
  uiButtons.push({ id, x, y, w, h });
}

let titleT = 0;
function renderTitle(){
  titleT += 1 / 60;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
  // parade
  const loop = (titleT * 120) % (W + 700) - 350;
  const fake = (type, x, y, face) => ({ type, x, y, r:DINOS[type].r, face, flash:0, anim:titleT * 10, t:titleT, seed:1, state: type === 'rex' ? 'charge' : 'chase', alt: type === 'ptera' ? 60 : 0, hp:1, maxHp:1, boss:true, st:1 });
  drawHuman({ ...makePlayer(0, CTRL.solo), x:loop + 160, y:640, face:1, walk:titleT * 13, inv:0, atkT:0, dashT:0 }, true);
  drawHuman({ ...makePlayer(1, CTRL.solo), x:loop + 110, y:665, face:1, walk:titleT * 13 + 1, inv:0, atkT:0, dashT:0 }, true);
  drawDino(fake('raptor', loop + 30, 650, 1)); drawDino(fake('pachy', loop - 20, 668, 1)); drawDino(fake('rex', loop - 110, 655, 1)); drawDino(fake('ptera', loop - 10, 600, 1)); drawDino(fake('spino', loop - 230, 650, 1)); drawDino(fake('brachio', loop - 360, 660, 1));
  ctx.save(); ctx.translate(W/2, 150); ctx.rotate(Math.sin(titleT * 2) * 0.02);
  txt('DINO SMASH', 0, 0, 104, '#ffca28'); ctx.restore();
  txt('Humans vs. Dinosaurs — hack, slash, collect loot, get stronger!', W/2, 225, 22, '#fff');
  if (saveData) {
    button('cont', 'CONTINUE', W/2 - 400, 275, 250, 74, '#66bb6a', `wave ${saveData.wave + 1} · ${saveData.numPlayers}P · press C`);
    button('p1', 'NEW 1 PLAYER', W/2 - 125, 275, 250, 74, '#4fc3f7', 'press 1');
    button('p2', 'NEW 2 PLAYERS', W/2 + 150, 275, 250, 74, '#f06292', 'co-op · press 2');
  } else {
    button('p1', '1 PLAYER', W/2 - 290, 275, 270, 74, '#4fc3f7', 'press 1');
    button('p2', '2 PLAYERS', W/2 + 20, 275, 270, 74, '#f06292', 'co-op · press 2');
  }
  ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(W/2 - 440, 375, 880, 190, 14); ctx.fill();
  const lines = [
    ['1 PLAYER', 'WASD / Arrows move  ·  Shift or Right-click = dash', '#4fc3f7'],
    [HERO_NAMES[0] + ' (2P)', 'WASD move  ·  Left Shift = dash', '#1e88e5'],
    [HERO_NAMES[1] + ' (2P)', 'Arrow keys move  ·  Right Shift = dash', '#ec407a'],
  ];
  lines.forEach((l, i) => { txt(l[0], W/2 - 420, 402 + i * 32, 15, l[2], 'left'); txt(l[1], W/2 - 270, 402 + i * 32, 15, '#eee', 'left', false); });
  txt('Your bow auto-aims at the nearest dino and fires when it\'s in range. Every 3rd arrow pierces!', W/2, 490, 15, '#ffe082', 'center', false);
  txt('Dash through attacks — you\'re invincible while dashing.', W/2, 513, 15, '#ffe082', 'center', false);
  txt('Glowing items dropped by dinos upgrade you. Spend bones in the shop between waves.', W/2, 535, 15, '#ffe082', 'center', false);
  if (best) txt('Best: wave ' + best, W/2, 590, 16, '#bdbdbd');
  txt('12 kinds of dinos · T-Rex & Spinosaurus bosses · watch out for golden ALPHA dinos!', W/2, 562, 14, '#a5d6a7', 'center', false);
}

function renderShop(){
  ctx.fillStyle = 'rgba(10,15,8,.82)'; ctx.fillRect(0, 0, W, H);
  txt('WAVE ' + wave + ' CLEARED!', W/2, 120, 44, '#ffd54f');
  txt('Bone Trader’s Hut — spend your bones', W/2, 160, 18, '#fff');
  drawItemIcon('bigbone', W/2 - 40, 196, 13); txt(String(team.bones), W/2 - 18, 197, 24, '#fff', 'left');
  const opts = getShop(), cw = 260, ch = 230, gap = 22, sx = (W - (cw * 4 + gap * 3)) / 2, cy = 225;
  opts.forEach((o, i) => {
    const x = sx + i * (cw + gap), hov = mouse.x >= x && mouse.x <= x + cw && mouse.y >= cy && mouse.y <= cy + ch;
    const can = o.cost != null && team.bones >= o.cost;
    ctx.fillStyle = hov && o.cost != null ? 'rgba(255,213,79,.18)' : 'rgba(0,0,0,.55)'; rr(x, cy, cw, ch, 14); ctx.fill();
    ctx.strokeStyle = o.cost == null ? '#555' : can ? '#ffd54f' : '#8d6e63'; ctx.lineWidth = 3; rr(x, cy, cw, ch, 14); ctx.stroke();
    txt('[' + (i + 1) + ']', x + 16, cy + 18, 14, '#bdbdbd', 'left', false);
    txt(o.title, x + cw/2, cy + 28, 22, '#fff');
    ctx.save(); ctx.translate(x + cw/2, cy + 88);
    if (o.icon === 'weapon') { ctx.rotate(-0.5); ctx.scale(2, 2); drawBow(Math.min(4, team.weapon + 1), 1); }
    else if (o.icon === 'armor') { const a = ARMORS[Math.min(4, team.armor + 1)]; ctx.scale(2, 2); ctx.fillStyle = a.color; rr(-12, -14, 24, 28, 6); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(-12, -4, 24, 3); ctx.fillRect(-12, 4, 24, 3); }
    else drawItemIcon(o.icon, 0, 0, 34);
    ctx.restore();
    txt(o.l1, x + cw/2, cy + 148, 16, '#ffe082', 'center', false);
    if (o.l2) txt(o.l2, x + cw/2, cy + 170, 14, '#ddd', 'center', false);
    if (o.cost != null) { drawItemIcon('bone', x + cw/2 - 26, cy + 205, 11); txt(String(o.cost), x + cw/2 - 10, cy + 206, 20, can ? '#fff' : '#ef5350', 'left'); }
    else txt('—', x + cw/2, cy + 205, 20, '#777');
    uiButtons.push({ id:'shop' + i, x, y:cy, w:cw, h:ch });
  });
  if (shopMsg) txt(shopMsg.txt, W/2, 480, 18, shopMsg.color || '#ef5350');
  txt(saveOk ? '✓ Progress saved' : '⚠ Saving not available in this browser', 20, H - 20, 14, saveOk ? `rgba(105,240,174,${0.5 + Math.min(1, savedFlash) * 0.5})` : '#ff8a80', 'left');
  // party stats
  players.forEach((p, i) => {
    const s = stats(p), x = players.length > 1 ? W/2 - 450 + i * 460 : W/2 - 220, y = 500, w = 440;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(x, y, w, 90, 10); ctx.fill(); ctx.strokeStyle = p.color; ctx.lineWidth = 2; rr(x, y, w, 90, 10); ctx.stroke();
    txt(p.name, x + 14, y + 18, 17, p.color, 'left');
    txt(`HP ${Math.ceil(p.hp)}/${p.maxHp}   DMG ${s.dmg}   ATK SPD ${Math.round(s.atkSpd * 100)}%   SPEED ${Math.round(s.speed / 2.3)}%   ARMOR ${s.armor}`, x + 14, y + 44, 13, '#eee', 'left', false);
    let ix = x + 20; for (const k of ITEM_KEYS) if (p.items[k]) { drawItemIcon(k, ix, y + 70, 10); txt('×' + p.items[k], ix + 11, y + 71, 12, '#fff', 'left'); ix += 38; }
    if (ix === x + 20) txt('No items yet', x + 14, y + 70, 12, '#9e9e9e', 'left', false);
  });
  button('next', 'NEXT WAVE  ▶', W/2 - 140, 614, 280, 60, '#66bb6a', 'press N');
}
function renderPause(){
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
  txt('PAUSED', W/2, H/2 - 80, 60, '#fff');
  button('resume', 'RESUME (P)', W/2 - 140, H/2 - 20, 280, 60, '#66bb6a');
  button('quit', 'QUIT TO TITLE', W/2 - 140, H/2 + 60, 280, 60, '#ef5350');
  txt(saveData ? `Progress auto-saves after every wave. Last save: after wave ${saveData.wave}.` : 'Progress auto-saves after you clear a wave.', W/2, H/2 + 160, 15, '#e0e0e0', 'center', false);
}
function renderOver(){
  ctx.fillStyle = 'rgba(40,0,0,.7)'; ctx.fillRect(0, 0, W, H);
  txt('THE DINOS WIN...', W/2, H/2 - 140, 64, '#ff7043');
  txt('You reached wave ' + wave + '  ·  ' + kills + ' dinos smashed', W/2, H/2 - 70, 24, '#fff');
  txt('Best: wave ' + best, W/2, H/2 - 35, 18, '#ffd54f');
  if (saveData) {
    button('cont', 'CONTINUE (C)', W/2 - 400, H/2 + 20, 250, 64, '#ffd54f', 'from after wave ' + saveData.wave);
    button('retry', 'NEW GAME (R)', W/2 - 125, H/2 + 20, 250, 64, '#66bb6a');
    button('title', 'TITLE (T)', W/2 + 150, H/2 + 20, 250, 64, '#4fc3f7');
  } else {
    button('retry', 'TRY AGAIN (R)', W/2 - 290, H/2 + 20, 270, 64, '#66bb6a');
    button('title', 'TITLE (T)', W/2 + 20, H/2 + 20, 270, 64, '#4fc3f7');
  }
}

/* ---------------- LOOP ---------------- */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try {
    if (hitstop > 0 && state === 'play') { hitstop -= dt; updateFx(dt * 0.2); }
    else update(dt);
  } catch (err) { console.error('update error', err); }
  try { render(); } catch (err) { console.error('render error', err); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0; }
  try { musicTick(); } catch (err) {}
  for (const k in pressed) delete pressed[k];
  mouse.clicked = false;
}
requestAnimationFrame(frame);
</script>
<script src="../touch-controls.js"></script>
<script>
TouchControls({
  back: 'top-left',
  backCompact: true,
  zones: [
    { side: 'left',  when: () => state === 'play' && numPlayers === 1, items: [ { stick: { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' } } ] },
    { side: 'right', when: () => state === 'play' && numPlayers === 1, items: [ { label: 'Dash', code: 'ShiftLeft', big: true } ] },
    { side: 'left',  when: () => state === 'play' && numPlayers === 2, items: [ { stick: { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' } }, { label: 'Dash', code: 'ShiftLeft', title: 'Aldie dash' } ] },
    { side: 'right', when: () => state === 'play' && numPlayers === 2, items: [ { label: 'Dash', code: 'ShiftRight', title: 'Briel dash' }, { stick: { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' } } ] },
    { side: 'top-right', when: () => state === 'play', items: [ { label: '❚❚', code: 'KeyP', tap: true, small: true, title: 'Pause' } ] },
  ],
});
</script>
